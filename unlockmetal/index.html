<!doctype html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>UnlockMetal</title>
   <meta name="robots" content="noindex">
   <style>
      :root { color-scheme: dark; }
      body {
         margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0b0b0f; color: #e7e7ea;
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { max-width: 34rem; padding: 2.5rem 1.5rem; }
      h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
      p { color: #a6a6ad; }
      a.btn {
         display: inline-block; margin-top: 1rem; padding: .7rem 1.2rem;
         border-radius: .6rem; background: #6d5cff; color: #fff;
         text-decoration: none; font-weight: 600;
      }
      code {
         display: block; margin-top: 1.5rem; padding: .9rem 1rem;
         background: #16161d; border-radius: .5rem; color: #cfcfd6;
         white-space: pre-wrap; font-size: 13px;
      }
      .updated { margin-top: 1.25rem; color: #7d7d85; font-size: 13px; }
   </style>
</head>
<body>
   <main>
      <h1>UnlockMetal</h1>
      <p>Personal macOS build. Apple silicon only. Roblox must be installed.</p>
      <a class="btn" href="UnlockMetal.zip" download>Download UnlockMetal.zip</a>
      <code>curl -fsSL https://mahfujmustafa.dev/unlockmetal/install.sh | bash</code>
      <p class="updated" id="updated">Last updated: checking…</p>
   </main>
   <script>
      fetch("version.json?" + Date.now())
         .then(function (response) { return response.json(); })
         .then(function (version) {
            var el = document.getElementById("updated");
            var when = version.published ? new Date(version.published) : null;

            if (when && !isNaN(when)) {
               el.textContent = "Last updated: " + when.toLocaleString(undefined, {
                  year: "numeric", month: "long", day: "numeric",
                  hour: "numeric", minute: "2-digit"
               });
            } else {
               el.textContent = "Last updated: " + (version.publishedHuman || "unknown");
            }
         })
         .catch(function () {
            document.getElementById("updated").textContent = "";
         });
   </script>
</body>
</html>
